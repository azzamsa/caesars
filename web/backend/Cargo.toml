[package]
name = "backend"
version = "0.0.0"
authors = ["azzamsa <vcs@azzamsa.com>"]
categories = ["web-programming"]
edition = "2024"
exclude = ["/README.md"]
keywords = ["boilerplate"]
license = "MIT"
description = "nROT backend"
rust-version = "1.92.0"

[dependencies]
# web server
axum = "0.8.8"
hyper = "1.8"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6.8", features = ["cors"] }

# GraphQL
async-graphql = { version = "7.2.0", features = ["uuid", "chrono"] }
async-graphql-axum = "7.2.0"

# Rest
utoipa = { version = "5.4.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

# log
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "chrono"] }

# Configurations
dotenvy = "0.15.7"

# Misc
nrot = "2.0.0"
serde = "1.0"
serde_json = "1.0"
thiserror = "2.0"
frunk = "0.4.4"
frunk_core = { version = "0.4.4" }

[dev-dependencies]
anyhow = "1.0"
cynic = "3.12.0"
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["full"] }
mime = "0.3.17"
serde = { version = "1.0", features = ["derive"] }
tower = { version = "0.5", features = ["util"] }
